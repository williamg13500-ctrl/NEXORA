<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Track enquiry — NEXORA GROUP</title><style>body{margin:0;background:#f1f0eb;color:#17252b;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:620px;margin:10vh auto;padding:28px;background:white;border:1px solid #d9dfe2;border-radius:12px}h1{margin-top:0}input,button{font:inherit;padding:12px;border:1px solid #b9c5ca;border-radius:5px}input{width:100%;box-sizing:border-box;margin:8px 0 12px}button{background:#092333;color:#fff;cursor:pointer}.result{margin-top:20px;padding:16px;background:#f0f3f4;border-radius:8px}a{color:#174b63}@media(max-width:680px){.wrap{margin:20px;padding:20px}}</style></head><body><main class="wrap"><a href="/">← NEXORA GROUP</a><h1>Track your enquiry</h1><p>Enter your reference code. Only status and public updates are displayed.</p><form id="track"><label for="ref">Reference code</label><input id="ref" required maxlength="12" placeholder="NX-7F3K9" autocomplete="off"><button>Check status</button></form><div id="result" class="result" role="status" aria-live="polite" hidden></div></main><script>const f=document.getElementById('track'),r=document.getElementById('ref'),out=document.getElementById('result');r.value=new URLSearchParams(location.search).get('ref')||'';async function check(){out.hidden=false;out.textContent='Checking…';try{const res=await fetch('/api/track?ref='+encodeURIComponent(r.value.trim()),{signal:AbortSignal.timeout(12000)}),d=await res.json();if(!res.ok)throw Error(d.error||'Could not find enquiry');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));out.innerHTML='<b>Reference:</b> '+esc(d.enquiry.reference_code)+'<br><b>Status:</b> '+esc(d.enquiry.status.replace('_',' '))+'<br><b>Last updated:</b> '+new Date(d.enquiry.updated_at).toLocaleString()+(d.enquiry.public_note?'<hr><b>Update:</b><br>'+esc(d.enquiry.public_note):'');}catch(e){out.textContent=e.name==='TimeoutError'||e.name==='AbortError'?'The request timed out. Check your connection and try again.':(e.message||'Tracking is temporarily unavailable.')}}f.addEventListener('submit',e=>{e.preventDefault();check()});if(r.value)check();</script><script src="/nexora-config.js"></script><script src="/contact-config.js" defer></script></body></html>
