<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry inbox — NEXORA GROUP</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#122431;font:14px/1.5 system-ui,sans-serif}header{background:#061522;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:12px}header a{color:#f3d27a}main{max-width:1400px;margin:auto;padding:22px}h1{font-size:28px;margin:0}small{color:#5d6d77}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #bac6cd;border-radius:5px;width:100%}button{cursor:pointer;background:#102c3c;color:#fff}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:16px}.item{background:#fff;border:1px solid #d5dde1;border-radius:8px;padding:16px}.item h2{font-size:18px;margin:4px 0}.item p{overflow-wrap:anywhere}.meta{font-size:12px;color:#566670}.item label{display:block;font-size:12px;margin-top:10px}.item textarea{min-height:68px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.wa{display:block;text-align:center;padding:10px;background:#dff4e9;color:#13583d;text-decoration:none;border-radius:5px;font-weight:700}#message{margin-top:10px}@media(max-width:650px){main{padding:14px}.filters{grid-template-columns:1fr 1fr}header{flex-direction:column}.toolbar{flex-direction:column;align-items:stretch}}@media(max-width:390px){.filters{grid-template-columns:1fr}}</style></head><body><header><div><b>NEXORA GROUP</b><br><small style="color:#c9d6de">Admin · Enquiry inbox</small></div><a href="/">View public hub ↗</a></header><main><h1>Enquiries</h1><p>Private notes are admin-only. Reply directly by WhatsApp or phone; this dashboard does not send email.</p><div class="filters"><input id="q" placeholder="Search name, phone, reference"><select id="brand"><option value="">All brands</option><option>SKYLINE Architecture &amp; Design</option><option>SCHOLARS UNIVERSITY</option><option>NEXORA TECHNOLOGIES</option><option>TEKDiD Forex Trading Technology</option><option>NEXORA GROUP / Not sure yet</option></select><select id="status"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="in_progress">In progress</option><option value="closed">Closed</option></select><input id="date" type="date" aria-label="Filter from date"></div><div class="toolbar"><b id="count">Loading inbox…</b><button id="csv" style="max-width:190px">Export CSV</button></div><p id="message" role="status" aria-live="polite"></p><div id="list" class="list"></div></main><script>let records=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const u=new URL('/api/admin-enquiries',location.origin);for(const k of ['q','brand','status'])u.searchParams.set(k,$(k).value);const r=await fetch(u,{credentials:'same-origin',redirect:'manual'});if(r.status===401||r.type==='opaqueredirect'){const d=r.status===401?await r.json().catch(()=>({})):{};location.href=d.login_url||'https://hatchable.com/console/login';return}if(r.status===403){location.href='/';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Inbox request failed.');records=d.enquiries||[];if($('date').value)records=records.filter(x=>String(x.created_at).slice(0,10)>=$('date').value);$('count').textContent=records.filter(x=>x.status==='new').length+' new · '+records.length+' shown';$('message').textContent='';$('list').innerHTML=records.map(x=>{const wa='https://wa.me/'+x.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('Hello '+x.name+', following up on your NEXORA GROUP enquiry '+x.reference_code+' about '+x.brand+'. ');return '<article class="item" data-id="'+x.id+'"><div class="meta">'+esc(x.reference_code)+' · '+esc(new Date(x.created_at).toLocaleString())+'</div><h2>'+esc(x.name)+'</h2><p><b>'+esc(x.brand)+'</b><br><a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a>'+(x.email?'<br>Optional email: '+esc(x.email):'')+'</p><p>'+esc(x.message)+'</p><label>Status<select class="edit-status"><option value="new" '+(x.status==='new'?'selected':'')+'>New</option><option value="contacted" '+(x.status==='contacted'?'selected':'')+'>Contacted</option><option value="in_progress" '+(x.status==='in_progress'?'selected':'')+'>In progress</option><option value="closed" '+(x.status==='closed'?'selected':'')+'>Closed</option></select></label><label>Public note<textarea class="public-note">'+esc(x.public_note)+'</textarea></label><label>Private notes<textarea class="private-notes">'+esc(x.private_notes)+'</textarea></label><div class="actions"><button class="save">Save changes</button><a class="wa" href="'+wa+'" target="_blank" rel="noopener">Reply on WhatsApp ↗</a><a href="tel:'+esc(x.phone)+'">Call visitor</a></div></article>';}).join('')||'<p>No enquiries match these filters.</p>';}catch(e){$('list').innerHTML='';$('message').textContent=e.message;}}$('list').addEventListener('click',async e=>{const b=e.target.closest('.save');if(!b)return;const c=b.closest('.item');b.disabled=true;try{const r=await fetch('/api/admin-enquiries',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({id:Number(c.dataset.id),status:c.querySelector('.edit-status').value,public_note:c.querySelector('.public-note').value,private_notes:c.querySelector('.private-notes').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');$('message').textContent='Saved.';await load();}catch(e){$('message').textContent=e.message}finally{b.disabled=false}});$('csv').onclick=()=>{const cols=['reference_code','name','phone','email','brand','message','status','public_note','private_notes','created_at'],csv=[cols.join(','),...records.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nexora-enquiries.csv';a.click();URL.revokeObjectURL(a.href)};let t;['q','brand','status','date'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{clearTimeout(t);t=setTimeout(load,250)}));load();</script><script src="/nexora-config.js"></script><script src="/contact-config.js" defer></script></body></html>
